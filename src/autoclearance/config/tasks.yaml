audit_invoice_task:
  description: >
    Analyze the provided invoice text: {invoice_data}.
    1. Extract invoice number, date, buyer and seller information.
    2. Extract all item details, including description, quantity, unit price, total price.
    3. Match the most accurate 6-digit HS Code for each item.
    4. Calculate and verify total weight and logic.
  expected_output: >
    A strictly formatted JSON object containing the following fields:
    - "invoice_info": {{ "number": "string", "date": "string" }}
    - "items": [
        {{ "description": "string", "quantity": number, "unit_price": number, "hs_code": "string", "weight": number }}
      ]
    - "total_value": number
    - "audit_alerts": ["list of discovered errors"]
    Do not include any Markdown format specifiers (such as ```json), return only pure JSON string.
  agent: ingest_agent

audit_task:
  description: >
    Review the data extracted by the Ingest Agent.
    Perform the following statistical checks:
    1. Verify if (Qty * Unit Price) == Total Value.
    2. Verify if Gross Weight > Net Weight.
    
    If any logic fails, generate a "Risk Alert" report detailing the error.
    If all logic passes, output "STATUS: PASSED".
  expected_output: >
    A final audit report summarizing the validation results and flagging any anomalies.
  agent: auditor_agent